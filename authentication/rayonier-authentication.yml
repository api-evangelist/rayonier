note: |
  Rayonier publishes no authentication page and no developer documentation of any kind. What is
  recorded here was read out of the server's own discovery documents and confirmed by calling
  the surface anonymously. The headline for an agent: every service in the Public and Hosted
  folders (45 services, 102 layers) answers metadata and /query calls with NO credential. The
  Utilities folder is the one place a token is demanded — it returned the ArcGIS error envelope
  {"error":{"code":499,"message":"Token Required"}}.

  The server itself runs token-based security (authInfo.isTokenBasedSecurity = true, tokens
  minted at the portal's generateToken endpoint) and the portal supports OAuth 2.0 and SAML
  (supportsOAuth = true, samlEnabled = true, disableSignup = true). Those are the credentials
  Rayonier staff use to reach non-public items; the sign-in page redirects to
  /portal/sharing/oauth2/authorize with client_id=arcgisonline. Self-signup is disabled, so
  there is no path for an outside developer to obtain a token — the public surface is the
  whole public surface.

  No write was attempted. Nine services ADVERTISE Create/Update/Delete in their capabilities
  string (see conventions/); whether an anonymous caller can exercise them was deliberately not
  tested.

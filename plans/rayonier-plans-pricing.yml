notes: 'plan_count is 0 because no API plan exists, not because the API is gated: the Public and Hosted
  ArcGIS folders answer without a credential and carry no published usage terms beyond the site Terms
  of Use at https://www.rayonier.com/legal. The single "Contact Sales" plan below is retained as the honest
  description of how any deeper data exchange is arranged.'

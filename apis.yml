description: 'Rayonier (NYSE: RYN) is a timberland real estate investment trust owning about 2 million acres in
  the US South and Pacific Northwest. It publishes no developer program, SDK or OpenAPI, but it runs a self-hosted
  ArcGIS Enterprise 11.5 instance at gis.rayonier.com whose Public and Hosted folders — 45 Feature and Map services,
  102 layers covering fee ownership, hunting lease units, bee-lease sites, land-sale tracts, forest stand inventory
  and wildfire overlays — answer anonymously over the GeoServices REST API and a SOAP/WSDL contract. Rayonier''s
  own hunting, beekeeping and Raydient land-sales websites consume these services.'

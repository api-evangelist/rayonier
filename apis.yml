  description: 'Rayonier''s self-managed ArcGIS Enterprise 11.5 server (portalDeploymentType ArcGISEnterprise, single
    tenant) on gis.rayonier.com. The Public folder (29 services) and Hosted folder (16 services) — 102 layers in
    all — serve the service directory, layer schemas and attribute/spatial /query operations to anonymous callers;
    the Utilities folder requires a portal token and there is no self-signup. Marquee layers: Rayonier fee ownership
    (6,216 polygons), hunting recreational lease units with permit areas, access points, food plots and active timber
    sales (the data behind rayonierhunting.com), bee-lease sites rebuilt nightly for rayonierbeekeeping.com, land-sale
    tracts for Raydient Rural, US South forest stand inventory, and NIFC fire perimeters joined to Rayonier ownership.
    Output is esriJSON, GeoJSON or PBF via f=; errors arrive inside HTTP 200 bodies. Each MapServer also serves
    a WSDL 1.1 SOAP contract (55 operations) at /arcgis/services/<service>/MapServer?wsdl, saved verbatim here —
    Rayonier publishes no OpenAPI, and the OGC WMS/WFS extensions are not enabled (400). Nine services advertise
    editing capabilities; no write was attempted and none should be.'

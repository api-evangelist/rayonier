description: Rayonier publishes no rate-limit documentation for its ArcGIS REST surface on gis.rayonier.com,
  and no rate-limit header (X-RateLimit-*, RateLimit-*, Retry-After) was observed on any of the ~120 anonymous
  responses collected on 2026-09-17. The only published ceiling is the per-layer maxRecordCount transfer
  limit, which caps a single page (5000 on the fee-ownership layer, 2000 on most others, 1000 on some
  Hosted layers) and is a page size, not a rate limit.
